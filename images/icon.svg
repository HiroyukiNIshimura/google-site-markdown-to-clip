<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Markdown to Google Sites</title>
  <desc id="desc">The letter M transforms into the letter G</desc>
  <defs>
    <linearGradient id="background" x1="10" y1="8" x2="118" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mColor" x1="18" y1="34" x2="57" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="gColor" x1="80" y1="35" x2="111" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#background)"/>
  <rect x="5" y="5" width="118" height="118" rx="25" fill="none" stroke="#64748B" stroke-opacity=".35" stroke-width="2"/>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">
    <text x="15" y="84" fill="url(#mColor)">M</text>
    <path d="M57 64h17m-8-8 8 8-8 8" fill="none" stroke="#F8FAFC" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <text x="76" y="84" fill="url(#gColor)">G</text>
  </g>
</svg>
